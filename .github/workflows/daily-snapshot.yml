name: Daily ASX Snapshot

on:
  schedule:
    # 08:30 UTC, Mon-Fri. Sydney is UTC+10 (AEST) or UTC+11 (AEDT), so this lands
    # at 18:30 or 19:30 local - after the 16:00 close in both halves of the year.
    # GitHub also queues scheduled runs, so the real start drifts 20-150 minutes
    # later; the job is written to be insensitive to when it actually fires.
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

# Never let two runs write the archive at the same time.
concurrency:
  group: daily-snapshot
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        working-directory: python
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: python
        run: |
          python scripts/export_schemas.py --check
          python -m pytest

      - name: Fetch snapshot and rebuild site data
        run: python python/scripts/fetch_daily_snapshot.py

      # Build before committing, not after. The commit is what triggers the
      # deploy, so proving the build works first is the only way to avoid
      # publishing data that breaks the site.
      - name: Verify the site builds with the new data
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/raw frontend/public/data frontend/data
          if git diff --staged --quiet; then
            echo "Nothing to commit - most likely a public holiday, which the pipeline skips."
            exit 0
          fi
          git commit -m "Daily ASX snapshot $(date -u +'%Y-%m-%d')"
          # A push once failed on repository size and that trading day was lost
          # permanently - the source has no as-of endpoint to backfill from.
          # Retry with a rebase rather than giving up on the first failure.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push failed (attempt $attempt) - rebasing and retrying"
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 10))
          done
          echo "::error::Push failed after 3 attempts"
          exit 1

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily snapshot failed — ${new Date().toISOString().slice(0, 10)}`,
              body: [
                'The scheduled snapshot did not complete.',
                '',
                `[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                'A missed session cannot be backfilled — the upstream scanner only',
                'ever returns the current state, so the gap is permanent. Re-run',
                'manually the same day if possible.',
              ].join('\n'),
            });
