name: API contract canary

# The scanner returns rows as bare positional arrays with no field names, so a
# column being reordered or dropped upstream would silently misalign all 89
# fields rather than error. Nothing else in the pipeline can detect that, so
# this checks the live contract on a schedule and opens an issue when it breaks.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"

      - name: Check the live column contract
        working-directory: python
        run: python -m pytest -m network -v

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Upstream data contract changed',
              body: [
                'The weekly canary against the live scanner failed.',
                '',
                `[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                'Rows arrive as positional arrays, so a changed column set misaligns',
                'every field rather than raising. Reconcile `ALL_COLUMNS` in',
                '`python/src/scrapers/tradingview.py` before the next daily run.',
              ].join('\n'),
            });
