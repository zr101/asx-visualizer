name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: python
        run: ruff check .

      - name: Schemas are current
        working-directory: python
        run: python scripts/export_schemas.py --check

      - name: Test
        working-directory: python
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # The generated types are the only thing keeping the Python payloads and
      # the TypeScript that reads them in step. A stale checkout means the two
      # have drifted, which historically showed up as a silently blank column.
      - name: Generated types are current
        working-directory: frontend
        run: npm run types:check

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
