[project]
name = "asx-visualizer"
version = "1.0.0"
description = "Daily point-in-time ASX market data pipeline and analytics"
requires-python = ">=3.11"

# Pinned with lower and upper bounds so a snapshot taken today can be reproduced
# later. The previous requirements.txt listed 24 packages with no bounds, of
# which 3 were actually imported.
dependencies = [
    "httpx>=0.27,<1.0",
    "pandas>=2.2,<4.0",
    "pyarrow>=16.0,<27.0",
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers -m 'not network'"
markers = [
    "network: hits the live TradingView API (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E731"]
